description: >-
  Avi Medical is a technology-enabled primary care provider headquartered in Munich, Germany,
  operating a network of modern general-practice (Hausarzt) medical practices paired with a
  patient-facing mobile app for booking appointments, video consultations, prescriptions, and
  digital access to medical records. The company combines physical clinics with digital health
  tooling to modernize German primary care, and is backed by Balderton Capital among other
  investors. This API Evangelist profile tracks the company; no public developer API, OpenAPI
  definition, or developer portal has been found on its public surface as of this enrichment pass.
